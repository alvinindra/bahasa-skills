name: Uji Pemeriksa

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jalankan uji pemeriksa
        run: python3 -m unittest discover -s tests -v
