name: Update Release Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release-tag:
    name: Update Release Tag in Git
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from plugin.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Update Git Release Tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.get_version.outputs.tag }}"
          echo "Updating release tags ($TAG, latest) to commit ${{ github.sha }}..."
          git tag -f "$TAG" "${{ github.sha }}"
          git tag -f "latest" "${{ github.sha }}"
          git push origin "$TAG" --force
          git push origin "latest" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
